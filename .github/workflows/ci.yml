name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  code-intelligence:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code_intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  # Phase 10: builds the real API Docker image and smoke-tests the actual
  # running container. This can only be verified here, not in local dev
  # for this project (no Docker daemon available there) - see
  # PHASE_10_STATUS.md for exactly what this does and doesn't prove.
  docker-build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t forgeai-api:ci .
      - name: Run the container
        run: |
          docker run -d --name forgeai-api-ci -p 8000:8000 \
            -e DATABASE_URL=sqlite:///./ci.db -e JWT_SECRET=ci-smoke-test-secret \
            forgeai-api:ci
      - name: Wait for readiness and check real endpoints
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "API is up"
              break
            fi
            echo "Waiting for API... ($i)"
            sleep 1
          done
          curl -sf http://localhost:8000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://localhost:8000/api/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -sf http://localhost:8000/metrics | tee /dev/stderr | grep -q 'forgeai_tool_calls_total'
      - name: Show container logs on failure
        if: failure()
        run: docker logs forgeai-api-ci
      - name: Tear down
        if: always()
        run: docker rm -f forgeai-api-ci || true

  # Phase 10: validates infrastructure/nginx/nginx.conf actually PARSES
  # via nginx's own `-t` check, run inside the real nginx image - this
  # cannot be checked at all in local dev here (no nginx installed). A
  # throwaway self-signed cert is generated only so `listen 443 ssl`'s
  # cert paths resolve; this proves syntax correctness, not that HTTPS
  # works end-to-end against real traffic. See PHASE_10_STATUS.md.
  nginx-config-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: |
          # The cert is generated INSIDE the container by the same user
          # that later reads it, rather than on the host and bind-mounted
          # in, to avoid any host/container file-permission mismatch.
          #
          # Real root cause of this check's earlier failures: nginx
          # resolves each `upstream { server ...; }` hostname at config
          # LOAD time (not lazily), and this config's `api`/`web`
          # upstreams only exist as service names inside the real
          # docker-compose network - standing this container up alone
          # gives nginx nothing to resolve them to, so `nginx -t` fails
          # with "host not found in upstream", independent of certs
          # entirely. --add-host points both names at loopback purely so
          # DNS resolution succeeds for this syntax check; nothing needs
          # to actually be listening on those addresses for `nginx -t`.
          docker run --rm \
            --add-host api:127.0.0.1 \
            --add-host web:127.0.0.1 \
            -v "$(pwd)/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:alpine sh -c "
              set -ex
              apk add --no-cache openssl
              mkdir -p /etc/nginx/certs
              openssl req -x509 -newkey rsa:2048 -nodes \
                -keyout /etc/nginx/certs/key.pem -out /etc/nginx/certs/cert.pem \
                -days 1 -subj '/CN=localhost'
              nginx -t
            "
