<style>

  }
}

:root[data-theme="dark"] {
  --app-bg: #0F1013;
  --app-surface: #191B20;
  --app-surface-2: #202329;
  --app-border: rgba(245, 240, 228, 0.10);
  --app-text: #F1EDE2;
  --app-text-dim: #93908A;

  --app-accent-2: #85A683;

}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--app-bg);
  color: var(--app-text);
  font-family: var(--font-body);
  line-height: 1.5;

}

.topbar {

}

.panel {

}

.post-frame {

.btn:focus-visible {

.btn-primary {

.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }

.stage-note {

@media (prefers-reduced-motion: reduce) {

<script>
/* ---------------------------------------------------------------------
   Brand config — auto-added to every post, never typed by the user
--------------------------------------------------------------------- */
const BRAND = {
  name: 'Saxena Estates',
  tagline: 'Homes, handled right.',
  monogram: 'SE',
  agent: 'Kritarth Saxena',
  phone: '6395168357',
  email: 'saxenakritarth0204@gmail.com'
};

document.getElementById('autoMonogram').textContent = BRAND.monogram;
document.getElementById('autoBrandName').textContent = BRAND.name;
document.getElementById('autoContactLine').textContent = `${BRAND.agent} · ${BRAND.phone}`;

const EXAMPLES = [
  {
    title: '4 BHK Luxury Villa, Ansal Golf City',
    location: 'Sushant Golf City, Lucknow',
    price: '₹2.5 Cr onwards',
    highlights: '3000 sq.ft · Corner plot · Ready to move'
  },
  {
    title: '2 BHK Premium Flat, Elysium Heights',
    location: 'Golf Course Extension, Gurgaon',
    price: '₹78 Lakh onwards',
    highlights: '800 sq.ft · North-East facing · 2 balconies'
  },
  {
    title: '3 BHK Sea View Apartment, Marina Bay Residency',
    location: 'Bandra West, Mumbai',
    price: '₹4.1 Cr onwards',
    highlights: '1450 sq.ft · High floor · Covered parking'
  }
];
let exampleIndex = 0;

/* ---------------------------------------------------------------------
   Canvas post renderer
--------------------------------------------------------------------- */
const CW = 1080, CH = 1350, SCALE = 2;
const canvas = document.getElementById('postCanvas');
canvas.width = CW * SCALE;
canvas.height = CH * SCALE;
const ctx = canvas.getContext('2d');

const INK = '#12151C';
const INK_SOFT = '#1B212D';
const BRASS = '#C9A24B';
const BRASS_DIM = 'rgba(201,162,75,0.55)';
const BRASS_FAINT = 'rgba(201,162,75,0.14)';
const PARCHMENT = '#F5F0E4';
const PARCHMENT_DIM = '#B7B0A0';
const FOREST = '#6E9270';
const FOREST_FILL = 'rgba(110,146,112,0.16)';

const MARGIN = 72;
const CONTENT_W = CW - MARGIN * 2;

function wrapWords(c, text, maxWidth) {
  const words = text.split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

function fitText(c, text, opts) {
  const { family, weight, maxSize, minSize, maxWidth, maxLines } = opts;
  for (let size = maxSize; size >= minSize; size -= 2) {
    c.font = `${weight} ${size}px ${family}`;
    const lines = wrapWords(c, text, maxWidth);
    if (lines.length <= maxLines) {
      return { size, lines };
    }
  }
  c.font = `${weight} ${minSize}px ${family}`;
  let lines = wrapWords(c, text, maxWidth);
  if (lines.length > maxLines) {
    lines = lines.slice(0, maxLines);
    let last = lines[maxLines - 1];
    while (c.measureText(last + '…').width > maxWidth && last.length > 1) {
      last = last.slice(0, -1);
    }
    lines[maxLines - 1] = last + '…';
  }
  return { size: minSize, lines };
}

function parseHighlights(raw) {
  return raw
    .split(/[·•,\n]/)
    .map(s => s.trim())
    .filter(Boolean)
    .slice(0, 6);
}

function drawBrandStrip(c) {
  const cy = 62;
  const r = 30;
  const cx = MARGIN + r;
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = INK_SOFT;
  c.fill();
  c.lineWidth = 2;
  c.strokeStyle = BRASS;
  c.stroke();

  c.fillStyle = PARCHMENT;
  c.font = `700 20px Fraunces`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(BRAND.monogram, cx, cy + 1);

  const tx = cx + r + 18;
  c.textAlign = 'left';
  c.textBaseline = 'alphabetic';
  c.font = `600 25px 'Work Sans'`;
  if ('letterSpacing' in c) c.letterSpacing = '0.5px';
  c.fillStyle = PARCHMENT;
  c.fillText(BRAND.name, tx, cy - 3);

  c.font = `500 13px 'IBM Plex Mono'`;
  if ('letterSpacing' in c) c.letterSpacing = '1px';
  c.fillStyle = BRASS;
  c.fillText(BRAND.tagline.toUpperCase(), tx, cy + 16);
  if ('letterSpacing' in c) c.letterSpacing = '0px';

  c.strokeStyle = BRASS_FAINT;
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(MARGIN, 122.5);
  c.lineTo(CW - MARGIN, 122.5);
  c.stroke();
}

function drawHeroArt(c, title, location) {
  const top = 150, bottom = 610, h = bottom - top;
  const grad = c.createLinearGradient(0, top, 0, bottom);
  grad.addColorStop(0, '#1D2432');
  grad.addColorStop(1, '#171B25');
  roundRect(c, MARGIN, top, CONTENT_W, h, 20);
  c.fillStyle = grad;
  c.fill();

  c.save();
  roundRectPath(c, MARGIN, top, CONTENT_W, h, 20);
  c.clip();

  c.strokeStyle = 'rgba(201,162,75,0.06)';
  c.lineWidth = 1;
  for (let x = MARGIN; x <= MARGIN + CONTENT_W; x += 36) {
    c.beginPath(); c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();
  }
  for (let y = top; y <= bottom; y += 36) {
    c.beginPath(); c.moveTo(MARGIN, y); c.lineTo(MARGIN + CONTENT_W, y); c.stroke();
  }

  const gx = MARGIN + CONTENT_W / 2, groundY = top + 300;
  c.strokeStyle = BRASS;
  c.lineWidth = 3;
  c.lineJoin = 'round';
  c.lineCap = 'round';

  c.beginPath();
  c.moveTo(gx - 150, groundY);
  c.lineTo(gx - 150, groundY - 110);
  c.lineTo(gx + 150, groundY - 110);
  c.lineTo(gx + 150, groundY);
  c.stroke();

  c.beginPath();
  c.moveTo(gx - 175, groundY - 110);
  c.lineTo(gx, groundY - 195);
  c.lineTo(gx + 175, groundY - 110);
  c.stroke();

  c.beginPath();
  c.rect(gx - 28, groundY - 70, 56, 70);
  c.stroke();

  c.beginPath();
  c.rect(gx - 115, groundY - 78, 40, 40);
  c.stroke();
  c.beginPath();
  c.moveTo(gx - 115, groundY - 58); c.lineTo(gx - 75, groundY - 58);
  c.moveTo(gx - 95, groundY - 78); c.lineTo(gx - 95, groundY - 38);
  c.stroke();

  c.beginPath();
  c.rect(gx + 75, groundY - 78, 40, 40);
  c.stroke();
  c.beginPath();
  c.moveTo(gx + 75, groundY - 58); c.lineTo(gx + 115, groundY - 58);
  c.moveTo(gx + 95, groundY - 78); c.lineTo(gx + 95, groundY - 38);
  c.stroke();

  c.beginPath();
  c.rect(gx + 110, groundY - 180, 14, 60);
  c.stroke();

  c.globalAlpha = 0.55;
  c.beginPath();
  c.arc(gx - 205, groundY - 34, 26, 0, Math.PI * 2);
  c.stroke();
  c.beginPath();
  c.moveTo(gx - 205, groundY - 8);
  c.lineTo(gx - 205, groundY + 6);
  c.stroke();
  c.globalAlpha = 1;

  c.strokeStyle = BRASS_DIM;
  c.lineWidth = 2.5;
  c.beginPath();
  c.moveTo(gx - 230, groundY);
  c.lineTo(gx + 230, groundY);
  c.stroke();

  c.font = `500 15px 'IBM Plex Mono'`;
  if ('letterSpacing' in c) c.letterSpacing = '1.5px';
  c.fillStyle = BRASS;
  c.textAlign = 'left';
  c.textBaseline = 'alphabetic';
  c.fillText('NEW LISTING', MARGIN + 26, top + 40);
  if ('letterSpacing' in c) c.letterSpacing = '0px';

  const scrimTop = bottom - 190;
  const scrim = c.createLinearGradient(0, scrimTop, 0, bottom);
  scrim.addColorStop(0, 'rgba(18,21,28,0)');
  scrim.addColorStop(1, 'rgba(18,21,28,0.94)');
  c.fillStyle = scrim;
  c.fillRect(MARGIN, scrimTop, CONTENT_W, bottom - scrimTop);

  const fit = fitText(c, title, {
    family: 'Fraunces', weight: 700, maxSize: 46, minSize: 30,
    maxWidth: CONTENT_W - 52, maxLines: 2
  });
  c.fillStyle = PARCHMENT;
  c.textAlign = 'left';
  const lineH = fit.size * 1.12;
  let ty = bottom - 62 - (fit.lines.length - 1) * lineH;
  for (const line of fit.lines) {
    c.fillText(line, MARGIN + 26, ty);
    ty += lineH;
  }

  c.font = `500 21px 'Work Sans'`;
  c.fillStyle = PARCHMENT_DIM;
  drawPin(c, MARGIN + 26, bottom - 28, 7);
  c.fillText(location, MARGIN + 44, bottom - 22);

  c.restore();
}

function drawPin(c, x, y, r) {
  c.save();
  c.fillStyle = c.fillStyle;
  c.beginPath();
  c.arc(x, y - r, r, Math.PI * 0.15, Math.PI * 0.85, true);
  c.lineTo(x, y);
  c.closePath();
  c.fill();
  c.restore();
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function roundRect(c, x, y, w, h, r) {
  roundRectPath(c, x, y, w, h, r);
}

function drawPriceRibbon(c, price) {
  const top = 640, h = 128;
  const grad = c.createLinearGradient(MARGIN, top, MARGIN, top + h);
  grad.addColorStop(0, '#D7B564');
  grad.addColorStop(1, '#B78F3F');
  roundRect(c, MARGIN, top, CONTENT_W, h, 18);
  c.fillStyle = grad;
  c.fill();

  c.font = `600 15px 'IBM Plex Mono'`;
  if ('letterSpacing' in c) c.letterSpacing = '1.5px';
  c.fillStyle = 'rgba(23,20,10,0.62)';
  c.textAlign = 'left';
  c.textBaseline = 'alphabetic';
  c.fillText('PRICE', MARGIN + 32, top + 34);
  if ('letterSpacing' in c) c.letterSpacing = '0px';

  const fit = fitText(c, price, {
    family: 'Fraunces', weight: 800, maxSize: 52, minSize: 30,
    maxWidth: CONTENT_W - 64, maxLines: 1
  });
  c.font = `800 ${fit.size}px Fraunces`;
  c.fillStyle = '#16130A';
  c.fillText(fit.lines[0], MARGIN + 32, top + h - 30);
}

function drawHighlights(c, items) {
  const top = 812;
  c.font = `600 14px 'IBM Plex Mono'`;
  if ('letterSpacing' in c) c.letterSpacing = '1.5px';
  c.fillStyle = BRASS;
  c.textAlign = 'left';
  c.fillText('HIGHLIGHTS', MARGIN, top);
  if ('letterSpacing' in c) c.letterSpacing = '0px';

  let x = MARGIN, y = top + 34;
  const pillH = 46, gapX = 12, gapY = 14, padX = 20;
  c.font = `600 19px 'Work Sans'`;

  for (const item of items) {
    const w = c.measureText(item).width + padX * 2;
    if (x + w > MARGIN + CONTENT_W) {
      x = MARGIN;
      y += pillH + gapY;
    }
    roundRect(c, x, y, w, pillH, pillH / 2);
    c.fillStyle = FOREST_FILL;
    c.fill();
    c.lineWidth = 1.5;
    c.strokeStyle = FOREST;
    c.stroke();

    c.fillStyle = PARCHMENT;
    c.textAlign = 'left';
    c.textBaseline = 'middle';
    c.fillText(item, x + padX, y + pillH / 2 + 1);

    x += w + gapX;
  }
  c.textBaseline = 'alphabetic';
}

function drawFooter(c) {
  const y = 1204;
  c.strokeStyle = BRASS_FAINT;
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(MARGIN, y);
  c.lineTo(CW - MARGIN, y);
  c.stroke();

  c.font = `600 13px 'IBM Plex Mono'`;
  if ('letterSpacing' in c) c.letterSpacing = '1.5px';
  c.fillStyle = BRASS;
  c.textAlign = 'left';
  c.fillText('LISTED BY', MARGIN, y + 38);
  if ('letterSpacing' in c) c.letterSpacing = '0px';

  c.font = `600 27px Fraunces`;
  c.fillStyle = PARCHMENT;
  c.fillText(BRAND.agent, MARGIN, y + 74);

  c.font = `500 18px 'Work Sans'`;
  c.fillStyle = PARCHMENT_DIM;
  c.fillText(`${BRAND.phone}  ·  ${BRAND.email}`, MARGIN, y + 104);
}

function render() {
  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.clearRect(0, 0, CW, CH);

  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, CW, CH);

  const title = document.getElementById('fTitle').value.trim() || 'Your property & type here';
  const location = document.getElementById('fLocation').value.trim() || 'Add a location';
  const price = document.getElementById('fPrice').value.trim() || 'Add a price';
  const highlights = parseHighlights(document.getElementById('fHighlights').value);

  drawBrandStrip(ctx);
  drawHeroArt(ctx, title, location);
  drawPriceRibbon(ctx, price);
  drawHighlights(ctx, highlights.length ? highlights : ['Add highlights to see them here']);
  drawFooter(ctx);

  ctx.restore();
}

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; render(); });
}

['fTitle', 'fLocation', 'fPrice', 'fHighlights'].forEach(id => {
  document.getElementById(id).addEventListener('input', queueRender);
});

function loadExample(data) {
  document.getElementById('fTitle').value = data.title;
  document.getElementById('fLocation').value = data.location;
  document.getElementById('fPrice').value = data.price;
  document.getElementById('fHighlights').value = data.highlights;
  queueRender();
}

document.getElementById('btnSample').addEventListener('click', () => {
  exampleIndex = (exampleIndex + 1) % EXAMPLES.length;
  loadExample(EXAMPLES[exampleIndex]);
});

document.getElementById('btnReset').addEventListener('click', () => {
  loadExample(EXAMPLES[0]);
  exampleIndex = 0;
});

/* ---------------------------------------------------------------------
   Download via the platform's downloads capability, with a
   right-click/long-press fallback when it isn't available.
--------------------------------------------------------------------- */
let downloadsApi = null;
(async () => {
  try {
    downloadsApi = window.claude ? await window.claude.use('downloads') : null;
  } catch (e) {
    downloadsApi = null;
  }
})();

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'property-post';
}

function setNote(msg) {
  document.getElementById('stageNote').textContent = msg;
}

document.getElementById('btnDownload').addEventListener('click', () => {
  canvas.toBlob(async (blob) => {
    if (!blob) return;
    const filename = `${slugify(document.getElementById('fTitle').value)}-post.png`;
    if (!downloadsApi) {
      setNote('Direct download isn’t available here — right-click (or long-press) the image above and choose "Save image".');
      return;
    }
    try {
      await downloadsApi.save({ filename, data: blob });
      setNote('Saved — check your downloads.');
    } catch (err) {
      if (err && err.code === 'declined') { setNote(''); return; }
      setNote('Couldn’t save automatically — right-click the image above and choose "Save image".');
    }
  }, 'image/png');
});

/* ---------------------------------------------------------------------
   Boot
--------------------------------------------------------------------- */
async function boot() {
  loadExample(EXAMPLES[0]);
  try {
    await Promise.all([
      document.fonts.load('700 46px Fraunces'),
      document.fonts.load('800 52px Fraunces'),
      document.fonts.load('600 27px Fraunces'),
      document.fonts.load('600 25px "Work Sans"'),
      document.fonts.load('500 21px "Work Sans"'),
      document.fonts.load('600 19px "Work Sans"'),
      document.fonts.load('500 13px "IBM Plex Mono"'),
      document.fonts.load('600 14px "IBM Plex Mono"')
    ]);
  } catch (e) {}
  render();
}
boot();
</script>
