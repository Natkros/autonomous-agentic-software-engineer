# Real nginx reverse-proxy + TLS-termination config. Validated for real
# syntax correctness in CI via `nginx -t` inside the official nginx image
# (see .github/workflows/ci.yml's docker-build-and-smoke-test job) — that
# proves the config PARSES, not that HTTPS actually works end-to-end: no
# live nginx has been run against real traffic, and the certificate paths
# below are placeholders an operator must provide (a real cert from
# Let's Encrypt/ACM/etc., or a self-signed one for local testing via
# `openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem
# -days 365`). See PHASE_10_STATUS.md.

events {
  worker_connections 1024;
}

http {
  upstream forgeai_api {
    server api:8000;
  }

  upstream forgeai_web {
    server web:3000;
  }

  server {
    listen 80;
    server_name _;
    # Real ACME/Let's Encrypt HTTP-01 challenges would be served from
    # here in production; for now, just redirect everything to HTTPS.
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
      proxy_pass http://forgeai_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
      proxy_pass http://forgeai_api;
    }

    location / {
      proxy_pass http://forgeai_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
